name: agentfile-lint
description: Lint agent instruction files (AGENTS.md / CLAUDE.md) in the checked-out repository.
branding:
  icon: check-square
  color: blue
inputs:
  config:
    description: Path to a config file. Default is .agentfile-lint.toml at the repo root, if present.
    required: false
    default: ''
  working-directory:
    description: Directory to run in, relative to the workspace (a repository checked out to a subdirectory). The config input is relative to it; reported paths are made relative to the workspace root so annotations land on the right file.
    required: false
    default: '.'
  python-version:
    description: Python version to set up (3.11 or newer).
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Run agentfile-lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IL_CONFIG: ${{ inputs.config }}
        IL_ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(--format github)
        if [ -n "$IL_CONFIG" ]; then args+=(--config "$IL_CONFIG"); fi
        # Findings are relative to the git root here; annotations need paths relative to the workspace.
        if top=$(git rev-parse --show-toplevel 2>/dev/null); then
          prefix=$(python -c 'import os, sys; r = os.path.relpath(os.path.realpath(sys.argv[1]), os.path.realpath(sys.argv[2])); print("" if r == "." or r.startswith("..") else r)' "$top" "$GITHUB_WORKSPACE")
          if [ -n "$prefix" ]; then args+=(--path-prefix "$prefix"); fi
        fi
        PYTHONPATH="$IL_ACTION_PATH" python -m agentfile_lint "${args[@]}"
