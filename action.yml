name: agentfile-lint
description: Lint agent instruction files (AGENTS.md / CLAUDE.md) in the checked-out repository.
branding:
  icon: check-square
  color: blue
inputs:
  config:
    description: Path to a config file. Default is .agentfile-lint.toml at the repo root, if present.
    required: false
    default: ''
  python-version:
    description: Python version to set up (3.11 or newer).
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Run agentfile-lint
      shell: bash
      env:
        IL_CONFIG: ${{ inputs.config }}
        IL_ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(--format github)
        if [ -n "$IL_CONFIG" ]; then args+=(--config "$IL_CONFIG"); fi
        PYTHONPATH="$IL_ACTION_PATH" python -m agentfile_lint "${args[@]}"
