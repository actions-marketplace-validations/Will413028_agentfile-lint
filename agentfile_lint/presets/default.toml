# Default preset shipped with agentfile-lint. Repo configs extend it and override single keys.
# It runs only objective checks; the heuristic rules (R3b, R4a, R4b, R5b, R6) and the C1
# convention are `off` here and turned on by `extends = ["preset:strict"]` (presets/strict.toml).
extends = []
# Shipped presets carry no [[overrides]]: overrides concatenate under `extends`, and a path scope is a
# property of one repository's layout. Overrides belong in the repository's own config (docs/design.md).

[discover]
# Claude Code also loads CLAUDE.local.md beside each CLAUDE.md and every .md under .claude/rules/
# (https://code.claude.com/docs/en/memory). A `.local.md` file is found only through a glob that names
# it, such as `**/CLAUDE.local.md`; it is usually untracked, so only `--no-git` finds it. A rules file
# named `*.local.md` needs `extend_globs = ["**/.claude/rules/**/*.local.md"]`.
globs = ["AGENTS.md", "**/AGENTS.md", "CLAUDE.md", "**/CLAUDE.md", "**/CLAUDE.local.md", "**/.claude/rules/**/*.md"]
# SKILL.md files are a family of their own: only the S rules run on them, and R and C rules never do.
skill_globs = ["**/SKILL.md"]
# Claude Code settings files (H rules): read from the directory a session starts in, at any depth.
hooks_globs = ["**/.claude/settings.json", "**/.claude/settings.local.json"]
# Project MCP servers (M rules): only the repository root's .mcp.json.
mcp_globs = [".mcp.json"]

[allowlist]
max_days = 90     # reject `expires` later than today + max_days
max_entries = 10  # more entries than this fails the configuration
warn_days = 14    # warn when an entry expires within this many days

# Parameters several rule ids share (docs/adr/0005). `excluded_blocks`: marker pairs whose text (and one
# trailing line ending) R1a, R1b and R1d do not count; R1c counts every byte an agent reads.
[shared.size]
excluded_blocks = []   # list of { begin = "...", end = "..." }

# Size is five ids (R1a to R1e), each with one level. The default uses only limits with an external source.
# `limits` lists replace as a whole: a repository config that sets one replaces the preset's list.
#
# R1a per-file bytes and R1b per-file lines: by path glob, the first matching entry of that id's
# `limits` applies; a file that matches no entry has no limit. Claude Code asks for fewer than 200
# lines per CLAUDE.md file (https://code.claude.com/docs/en/memory) and reads AGENTS.md when no
# CLAUDE.md exists; guidance, not a point where text is dropped, so R1b is a warning. Claude Code's
# per-file character limit is R1e.
[rules.R1a]
level = "error"
limits = []   # list of { glob = "...", max_bytes = N }

[rules.R1b]
level = "warn"

[[rules.R1b.limits]]
glob = "**/AGENTS.md"
max_lines = 200

[[rules.R1b.limits]]
glob = "**/CLAUDE.md"
max_lines = 200

# R1c combined bytes on a path: a file plus the files matching the same glob in its ancestor
# directories, reported where the total first exceeds `max_bytes`; every entry applies. Codex reads
# AGENTS.md from the root down to the working directory and stops adding files once they total 32 KiB
# (`project_doc_max_bytes`, https://learn.chatgpt.com/docs/agent-configuration/agents-md): a hard
# limit, so an error. A single file over the limit is reported the same way.
[rules.R1c]
level = "error"

[[rules.R1c.limits]]
glob = "**/AGENTS.md"
max_bytes = 32768

# R1d characters per line; `max_chars` is required once the level is not off.
[rules.R1d]
level = "off"
# max_chars = 500

# R1e characters per file, by path glob (first match wins): an entry without `max_chars` sets no limit,
# and one with `frontmatter_key` applies only to files whose frontmatter has that top-level key.
# Counted as `wc -m` counts, after removing the frontmatter and block-level HTML comments and trimming
# whitespace; `excluded_blocks` does not apply. Claude Code gives only the start of a file it loads on
# demand when the file is over 40,000 characters with a 200K context (150,000 or 200,000 with 1M):
# CLAUDE.md and CLAUDE.local.md in a subdirectory, rules in a subdirectory's .claude/rules/, and
# path-scoped rules (`paths` frontmatter) in the root .claude/rules/
# (https://code.claude.com/docs/en/memory, "Claude ignores the end of my subdirectory CLAUDE.md").
# Files loaded at launch are given whole. The limit depends on the context window, so a warning.
[rules.R1e]
level = "warn"

[[rules.R1e.limits]]
glob = ".claude/CLAUDE.md"   # the project CLAUDE.md, loaded at launch: no limit

[[rules.R1e.limits]]
glob = ".claude/rules/**/*.md"
max_chars = 40000
frontmatter_key = "paths"   # a path-scoped root rule

[[rules.R1e.limits]]
glob = ".claude/rules/**/*.md"   # any other root rule, loaded at launch: no limit

[[rules.R1e.limits]]
glob = "*/**/CLAUDE.md"
max_chars = 40000

[[rules.R1e.limits]]
glob = "*/**/CLAUDE.local.md"
max_chars = 40000

[[rules.R1e.limits]]
glob = "*/**/.claude/rules/**/*.md"
max_chars = 40000

# ---------------------------------------------------------------------------------------------
# Rules other than R1a and R1c enter at `warn` (see CHANGELOG, "Graduated"). A repository raises a rule
# with `level = "error"` in its own config once it is clean.
# ---------------------------------------------------------------------------------------------

# R2 shape: section headings in order. `shapes` is empty here; a repository lists its own:
#   [[rules.R2.shapes]]
#   glob = "modules/*/AGENTS.md"      # first matching shape wins
#   sections = ["Purpose", "Data", "Invariants"]
#   mode = "exact"                    # exact: no other headings; ordered: extra headings allowed
#   heading_level = 2
#   title = true                      # first content is a level-1 title
#   purpose = true                    # ...followed by a one-line purpose
#   bullets_only = ["Invariants"]     # these sections hold only list items
#   must_match = ["docs/spec/"]       # regexes that must match somewhere in the file
[rules.R2]
level = "warn"
shapes = []

# R3a test names: a backticked name must be defined in a tracked test file of that language.
[rules.R3a]
level = "warn"

[[rules.R3a.test_defs]]
name = 'Test[A-Z0-9_][A-Za-z0-9_]*'
definition = 'func (?:\([^)]*\)\s*)?{name}\('
files = ["**/*_test.go"]

[[rules.R3a.test_defs]]
name = 'test_[A-Za-z0-9_]+'
definition = 'def {name}\('
files = ["**/test_*.py", "**/*_test.py"]

# R3b path references: heuristic, tried against the file's directory, its ancestors, the repo root
# and `base_dirs` (entries may use `*`), also under `source_roots` and with `resolve_extensions`.
# Off by default (heuristic); preset:strict sets warn.
[rules.R3b]
level = "off"
base_dirs = []
source_roots = []
resolve_extensions = []
file_extensions = ["md", "go", "py", "ts", "tsx", "js", "jsx", "json", "toml", "yaml", "yml", "sql", "sh", "dart", "proto", "css", "html", "txt"]
ignore_patterns = [
  '(^|/)node_modules(/|$)',
  '(^|/)\.env(\.|$)',
  '^\.git(/|$)',
  '(^|/)\.(next|vercel|venv|cache)(/|$)',
  '\.gitkeep$',
]
ignore_negated_words = []   # skip references on lines containing one of these words
check_bare_names = false    # a name without a directory (`schema.sql`) is not checked

# R3c spec references (`specs` maps instruction files to their spec; empty = rule inactive).
#   [[rules.R3c.specs]]
#   glob = "modules/*/AGENTS.md"
#   spec = "docs/modules/{1}.md"      # {1} = what the first `*` matched
[rules.R3c]
level = "warn"
specs = []
ref_pattern = '§\s*(\d+(?:\.\d+)*)'
heading_pattern = '^#{1,6}[ \t]+(?:§[ \t]*)?(\d+(?:\.\d+)*)(?![0-9])'
ignore_qualified = true   # `other-doc §3` points elsewhere and is skipped...
ignore_before = []        # skip a reference when the text before it on the line matches one of these regexes
plain_words = ["see", "spec", "specification", "section", "sections", "in", "per", "and", "or", "to", "at", "of", "the", "also", "cf", "ref"]  # ...unless the word before is one of these

# R4a dated references (dates, issue numbers) and R4b narrative words.
# Off by default (heuristic); preset:strict sets warn.
[rules.R4a]
level = "off"
date_patterns = ['(?<![0-9])(?:19|20)\d{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])(?![0-9])']
issue_patterns = [
  '(?<![A-Za-z0-9_&#/])#\d+(?![A-Za-z0-9_])',
  '(?i:(?<![A-Za-z])(?:issue|pull request|PR)\s+#?\d+)(?![0-9])',
]
# Names that carry a date are not dates: a path, a file name, a date-prefixed slug (`2026-01-02-title`).
ignore_token_patterns = ['/', '\.(?:md|txt|sql|go|ts|tsx|js|py|toml|ya?ml|json)\b', '(?:19|20)[0-9]{2}-[0-9]{2}-[0-9]{2}-[A-Za-z]']

[rules.R4b]
level = "off"
narrative_words = [
  "currently", "recently", "previously", "formerly", "no longer", "used to", "for now",
  "at the moment", "temporarily", "newly",
  "目前", "最近", "近期", "暫時", "以前", "原本", "已改為", "已移除",
]

# R5a and R5b duplicates: identical lines (>= min_chars) in an ancestor and a descendant file (R5a,
# on the descendant) or in other files (R5b). Always compares the full tracked set.
# `ancestor_pairs`: `same-name` counts only same-name files in ancestor directories (AGENTS.md and
# sub/AGENTS.md, which one agent loads together); `any` also counts different names and files in one
# directory. Other pairs are R5b. preset:strict sets `any` and turns R5b on at warn.
[shared.duplicates]
ancestor_pairs = "same-name"
min_chars = 40
ignore_headings = true
ignore_patterns = []
exclude = []          # globs left out of the R5a/R5b comparison entirely

[rules.R5a]
level = "warn"

[rules.R5b]
level = "off"

# R6 copied constants: candidates only, always warnings. Off by default (heuristic); preset:strict sets warn.
[rules.R6]
level = "off"
candidate_patterns = [
  '`[A-Za-z_][A-Za-z0-9_.]*\s*(?::=|=|:)\s*-?\d[0-9_.,]*[A-Za-z%]*`',
  '\b[A-Z][A-Z0-9]*_[A-Z0-9_]+\b[ \t`=:]{1,6}[0-9]+',
  '(?<![A-Za-z0-9])\d[0-9,_]*\s?(?:ms|seconds?|minutes?|hours?|days?|bytes|KB|MB|GB|秒|分鐘|小時|天|字元)(?![A-Za-z])',
]

# C1 CLAUDE.md: `import-only` (one line, the import) or `forbid` (no CLAUDE.md at all).
# Off by default (a convention of this tool, not an error in other repositories); preset:strict sets warn.
[rules.C1]
level = "off"
mode = "import-only"
import_line = "@AGENTS.md"

# ---------------------------------------------------------------------------------------------
# S1 to S14: SKILL.md (docs/rules.md, "S1 to S14 SKILL.md"; docs/adr/0007). Two readers read these
# files differently; each id protects one or both:
#   Claude Code: S1 to S4, S12, S14 (on here), S13 (an estimate: off here, on in preset:strict)
#   claude.ai upload, the Skills API and the Agent Skills specification: S1, S2, S5 to S11, S14
# S5 to S11 are off: Claude Code accepts what they report. A repository that uploads its skills adds
# `extends = ["preset:agentskills"]`, or turns single ids on with their level.
# ---------------------------------------------------------------------------------------------
[rules.S1]
level = "warn"

[rules.S2]
level = "warn"

[rules.S3]
level = "warn"
max_chars = 1536   # Claude Code's default `skillListingMaxDescChars`; follow yours if you changed it

[rules.S4]
level = "warn"

[rules.S5]
level = "off"

[rules.S6]
level = "off"

[rules.S7]
level = "off"

[rules.S8]
level = "off"

[rules.S9]
level = "off"

[rules.S10]
level = "off"

[rules.S11]
level = "off"

[rules.S12]
level = "warn"

# S13: when Claude Code compacts a conversation it re-attaches each invoked skill but keeps only its
# first 5,000 tokens (https://code.claude.com/docs/en/skills, "Skill content lifecycle"). The count
# here is an estimate without a tokenizer (4 ASCII characters or 1 other character per token), so the
# rule is off by default and a warning in preset:strict.
[rules.S13]
level = "off"
max_tokens = 5000

# S14: a relative Markdown link in a SKILL.md body whose target is not a tracked file or directory.
[rules.S14]
level = "warn"

# ---------------------------------------------------------------------------------------------
# P1 to P5: Claude Code rule files, the instruction files inside a `.claude/rules/` directory
# (docs/rules.md, "P1 to P5 rule files"). A rule file loads in every session unless its frontmatter
# has `paths`; each id reports a frontmatter that silently gives the other behaviour than the one
# written. P4 `keys`: keys that are not `paths` but look like it (`Paths` in any case is always one).
# ---------------------------------------------------------------------------------------------
[rules.P1]
level = "warn"

[rules.P2]
level = "warn"

[rules.P3]
level = "warn"

[rules.P4]
level = "warn"
keys = ["path", "glob", "globs"]

[rules.P5]
level = "warn"

# ---------------------------------------------------------------------------------------------
# H1 to H6: hooks in Claude Code settings files; M1 to M4: .mcp.json (docs/rules.md, "H1 to H6
# hooks" and "M1 to M4 .mcp.json"). Only what the Claude Code docs state and what makes Claude Code
# skip the file or an entry; optional fields and other keys are not checked.
# ---------------------------------------------------------------------------------------------
[rules.H1]
level = "warn"

[rules.H2]
level = "warn"

[rules.H3]
level = "warn"

[rules.H4]
level = "warn"

[rules.H5]
level = "warn"

[rules.H6]
level = "warn"

[rules.M1]
level = "warn"

[rules.M2]
level = "warn"

[rules.M3]
level = "warn"

[rules.M4]
level = "warn"
