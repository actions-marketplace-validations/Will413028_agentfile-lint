[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfile-lint"
version = "0.8.0"
description = "A linter for agent instruction files (AGENTS.md / CLAUDE.md), configured by TOML."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentfile-lint = "agentfile_lint.cli:main"

[tool.setuptools.packages.find]
include = ["agentfile_lint*"]

[tool.setuptools.package-data]
agentfile_lint = ["presets/*.toml", "_vendor/*.txt", "_yaml/LICENSE", "_yaml/PROVENANCE"]
